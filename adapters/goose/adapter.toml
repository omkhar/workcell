# Workcell adapter manifest; see adapters/README.md. No review certified this
# CLI, so its options pass only through [flags] allow (reject_manifest_args).

schema = 1
id = "goose"
tier = "uncertified"
binary = "goose"

[install]
method = "binary"
version_arg = "GOOSE_VERSION"
provenance = "scripts/verify-upstream-goose-release.sh"

# seed_goose_home creates the goose config directory, so an injection policy
# may not stage a file there.
[home]
reserved_targets = ["/state/agent-home/.config/goose"]

# goose talks to the model provider that goose configure selects. Workcell
# allows one provider host: the Anthropic API. Workcell stages no goose
# credential; goose configure in the session saves the Anthropic API key in
# the session home.
[egress]
endpoints = ["api.anthropic.com:443"]

# Classifies tests/fixtures/flags/goose.txt. The default command and session
# start the terminal UI, and run -t runs one prompt. configure and info set up
# and show the provider. other_commands names every other top-level command
# and alias that the help lists, and the hidden commands that a probe of each
# word in the pinned binary found (goose <word> --help). deny names the
# extension, container, recipe and parameter inputs.
[flags]
subcommands = [
  "configure", "diagnostics", "export", "help", "import", "info", "list",
  "remove", "rename", "run", "s", "session",
]
other_commands = [
  "acp", "completion", "doctor", "gateway", "gw", "mcp", "mcp-probe",
  "plugin", "recipe", "review", "sched", "schedule", "serve", "skills",
  "term", "validate-extensions",
]
allow = [
  "--check", "--debug", "--edit", "--fork", "-h", "--help", "--history",
  "-i", "--instructions", "--interactive", "--max-tool-repetitions",
  "--max-turns", "--model", "-n", "--name", "--no-profile", "--no-session",
  "--output-format", "--path", "--provider", "-q", "--quiet", "-r",
  "--resume", "-s", "--session-id", "--stats", "--system", "-t", "--text",
  "-V", "-v", "--verbose", "--version",
]
deny = [
  "--container", "--explain", "--params", "--recipe", "--render-recipe",
  "--sub-recipe", "--with-builtin", "--with-extension",
  "--with-streamable-http-extension",
]
