#:schema https://developers.openai.com/codex/config-schema.json

# Repo-local Codex defaults for the Workcell runtime. Keep this file usable as a
# standalone `.codex/config.toml` after copying it into a workspace.
#
# Codex 0.134+ uses the layered profile-v2 model. This base config is layered
# under the per-profile `<name>.config.toml` files (strict/development/build/
# breakglass) that the runtime selects with `--profile`. The base deliberately
# does NOT set sandbox_mode or approval_policy: every sandbox/approval decision
# is profile-scoped, so the floor cannot be widened from the base config.

model = "gpt-5.6-terra"
model_reasoning_effort = "medium"
analytics.enabled = false
history.persistence = "none"
web_search = "disabled"
project_doc_fallback_filenames = []
project_root_markers = [".git"]
developer_instructions = """
Complete the authorized task using the repository's instructions and acceptance checks.
Use independent, bounded subagents when they save time or improve quality; handle atomic work directly when delegation adds overhead. Keep workers as leaves and respect the configured or runtime concurrency limit.
Select models by ambiguity, coupling, consequences, and verification difficulty, not task keywords. Use gpt-5.6-luna with low reasoning for narrow inventory, extraction, mechanical edits, and bounded checks; gpt-5.6-terra with medium reasoning for ordinary bounded work; gpt-5.6-sol with high reasoning for complex coupled work; and gpt-6-astra with high reasoning for the hardest ambiguous, architectural, or unresolved work. Use gpt-6-astra with xhigh reasoning only for a direct exceptional task when evidence warrants it.
Use actual model and reasoning controls advertised by the runtime, or a configured role that sets both. Task names do not select models. A fixed role can override explicit spawn settings: select another role or a direct spawn to escalate. Give each worker the relevant context, permitted scope, deliverable, and acceptance checks; request concise evidence.
If the runtime exposes fork_turns, use none or a supported recent-turn count when selecting explicit model overrides; full-history forks inherit the parent model and reasoning effort. Otherwise use the controls that the runtime advertises.
If a worker cannot meet its checks, reassess the scope and model with its evidence rather than repeating identical attempts. If selection is unavailable, report that limitation and use another available model only if it can satisfy the same checks. Verify selection through runtime metadata where available; do not rely on a worker's self-description.
Do not claim that instructions switch the running parent model. Do not silently switch the running parent model or effort. Preserve explicit user model choices and higher-priority runtime instructions. Run required repository checks and broaden validation only when changes, failures, or unresolved concerns justify it.
"""

[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"

[shell_environment_policy]
inherit = "core"
exclude = [
  "*_TOKEN",
  "*_TOKEN_*",
  "*_SECRET",
  "*_SECRET_*",
  "*_KEY",
  "*_KEY_*",
  "AWS_*",
  "AZURE_*",
  "GCP_*",
  "GOOGLE_*",
  "KUBECONFIG",
  "SSH_AUTH_SOCK",
  "SSH_AGENT_PID",
  "DOCKER_HOST",
  "DOCKER_TLS_VERIFY",
  "DOCKER_CERT_PATH",
]
set = { WORKCELL_RUNTIME = "1" }

[sandbox_workspace_write]
exclude_slash_tmp = true
# Keep `/tmp` excluded, but allow the managed session tmpdir at `/state/tmp`.
exclude_tmpdir_env_var = false
network_access = false

[features]
# Codex 0.153.2 keeps unified execution on without an administrator requirement.
# Workcell disables the incompatible inner sandbox in the managed wrapper.
unified_exec = true
# The runtime installs the matching signed host beside the Codex executable.
code_mode_host = true
# Defense in depth for the 0.143+ plugin/marketplace surface: even though the
# provider policy rejects the `plugin` subcommand outright, pin the plugin
# feature flags off in the runtime baseline so no config layer can silently
# reintroduce remote marketplace fetch/install or plugin sharing.
plugins = false
plugin_sharing = false
remote_plugin = false
