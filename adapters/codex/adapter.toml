# Workcell adapter manifest (not read at runtime yet); see adapters/README.md.

schema = 1
id = "codex"
tier = "certified"
binary = "codex"
shared_credentials = true
managed_document = true

[install]
method = "binary"
version_arg = "CODEX_VERSION"
provenance = "scripts/verify-upstream-codex-release.sh"

[home]
reserved_targets = [
  "/state/agent-home/.codex",
  "/state/agent-home/.codex/AGENTS.md",
  "/state/agent-home/.codex/auth.json",
  "/state/agent-home/.codex/config.toml",
  "/state/agent-home/.codex/managed_config.toml",
  "/state/agent-home/.codex/requirements.toml",
  "/state/agent-home/.codex/agents",
  "/state/agent-home/.codex/rules",
  "/state/agent-home/.codex/mcp",
]

[credentials.codex_auth]
container_path = "/opt/workcell/host-inputs/credentials/codex-auth.json"

[egress]
endpoints = ["api.openai.com:443", "auth.openai.com:443", "chatgpt.com:443"]

# Each option of the pinned CLI help (tests/fixtures/flags/codex.txt) is in allow
# or deny, as reject_unsafe_codex_args decides; a Go test proves each entry.
# subcommands names the allowed subcommands whose --help the inventory reads.
[flags]
subcommands = [
  "exec", "review", "login", "logout", "completion", "doctor", "apply",
  "resume", "fork", "archive", "unarchive", "delete", "features", "execpolicy",
]
allow = [
  "--all", "--approve-for-me", "--ascii", "--base", "-c", "--color", "--commit",
  "--config", "--device-auth", "--ephemeral", "--force", "-h", "--help", "-i",
  "--ignore-rules", "--ignore-user-config", "--image",
  "--include-non-interactive", "--json", "--last", "--local-provider", "-m",
  "--model", "--no-alt-screen", "--no-color", "--no-daemon", "-o", "--oss",
  "--output-last-message", "--output-schema", "--skip-git-repo-check",
  "--strict-config", "--summary", "--thread-source", "--title", "--uncommitted",
  "-V", "--version", "--with-access-token", "--with-api-key", "--worktree",
]
deny = [
  "-a", "--add-dir", "--ask-for-approval", "-C", "--cd",
  "--dangerously-bypass-approvals-and-sandbox",
  "--dangerously-bypass-hook-trust", "--disable", "--enable", "--full-auto",
  "-p", "--profile", "--remote", "--remote-auth-token-env", "-s", "--sandbox",
  "--search", "--yolo",
]
