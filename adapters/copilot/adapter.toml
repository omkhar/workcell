# Workcell adapter manifest (not read at runtime yet); see adapters/README.md.

schema = 1
id = "copilot"
tier = "certified"
binary = "copilot"
# Copilot uses only copilot_github_token, so host gh auth is never implicit.
shared_credentials = false
# Managed Copilot custom instructions are disabled.
managed_document = false

[install]
method = "binary"
version_arg = "COPILOT_VERSION"
provenance = "scripts/verify-upstream-copilot-release.sh"

[home]
reserved_targets = [
  "/state/agent-home/.copilot",
  "/state/agent-home/.copilot/AGENTS.md",
  "/state/agent-home/.copilot/logs",
  "/state/agent-home/.cache/github-copilot",
  "/state/agent-home/.config/github-copilot",
]

[credentials.copilot_github_token]
container_path = "/opt/workcell/host-inputs/credentials/copilot-github-token.txt"

[egress]
endpoints = [
  "api.githubcopilot.com:443",
  "api.individual.githubcopilot.com:443",
  "api.github.com:443",
  "github.com:443",
]

# Classifies tests/fixtures/flags/copilot.txt; the reject_unsafe_copilot_args parity test lands next.
[flags]
subcommands = [
  "app", "version", "workflow", "sessions", "memories", "instruction", "lsp",
  "completion",
]
allow = [
  "--auto-tier", "--banner", "--context",
  "--enable-mcp-server", "--fleet", "-h", "--help", "--log-level",
  "--max-ai-credits", "--model", "--mouse", "--no-color",
  "--no-eager-powershell-resolution", "--no-experimental", "--no-mouse", "-p",
  "--plain-diff", "--prompt", "--reasoning-effort", "-s", "--screen-reader",
  "--silent", "--stream", "--usage-output-file", "-v", "--version",
]
deny = [
  "-A", "-a", "--acp", "--add-dir", "--add-github-mcp-tool",
  "--add-github-mcp-toolset", "--additional-mcp-config", "--agent",
  "--allow-all", "--allow-all-mcp-server-instructions", "--allow-all-paths",
  "--allow-all-tools", "--allow-all-urls", "--allow-tool", "--allow-url",
  "--assisted-approval", "--attachment", "--autopilot", "--available-tools",
  "--bash-env", "-C", "-c",
  "--config-dir", "--connect", "--continue", "--deny-tool", "--deny-url",
  "--disable-builtin-mcps", "--disable-mcp-server", "--disallow-temp-dir",
  "--dynamic-retrieval", "--enable-all-github-mcp-tools", "--enable-memory",
  "--excluded-tools", "--experimental", "--extension-sdk-path", "-i",
  "--interactive", "--log-dir", "--max-autopilot-continues", "--mode", "-n",
  "--name", "--no-ask-user", "--no-auto-update", "--no-bash-env",
  "--no-custom-instructions", "--no-remote", "--no-remote-export",
  "--no-sandbox", "--output-format", "--plan", "--plugin-dir", "-r", "--remote",
  "--remote-export", "--resume", "--sandbox", "--secret-env-vars",
  "--session-id", "--share", "--share-gist", "-w", "--worktree", "--yolo",
]
