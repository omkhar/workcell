version = 1
# A bump waits 48 hours after the release timestamp that each provider updater reads.
cooloff_hours = 48

[provider.codex]
channel = "stable"
# The runtime consumes the reviewed musl Linux release assets (which carry
# sigstore bundles), resolving the earlier GNU-asset holdback. The adapter
# config uses the layered --profile-v2 model (base config.toml plus per-profile
# `<name>.config.toml` files), so there is no profile-model ceiling; the normal
# stable channel and cool-off govern Codex.

[provider.claude]
channel = "stable"
# Cool-off eligibility uses the later of the stable registry publication and
# native release manifest build times.

[provider.copilot]
channel = "stable"

[provider.gemini]
channel = "stable"
