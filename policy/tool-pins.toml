# The single source of the CI and release tool pins. No workflow holds a copy:
# each job that uses a pin runs scripts/ci/load-tool-pins.sh as its `pins` step,
# which reads this file at run time and fails closed on any line it does not
# expect, and binds the value with `${{ steps.pins.outputs.<key> }}`. A pin bump
# (`scripts/update-upstream-pins.sh`) therefore changes this file and never a
# file under .github/workflows/. `check-pinned-inputs` validates every value,
# requires the loader and the Go parser to read the same pins, and rejects any
# inline tool-pin value in a workflow.
#
# Keep the format strict: blank lines, `#` comments, the [tool_pins] header and
# `key = "value"` lines only. Versions are stored exactly as the consumers use
# them (actionlint, zizmor and ORAS versions have no leading `v`).

[tool_pins]
