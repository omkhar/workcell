# Reviewed chokepoint for the CI/release tool pins. The pin values also live
# inline in the workflows; `check-pinned-inputs` asserts every workflow copy
# equals the value here, and `scripts/update-upstream-pins.sh` rewrites the
# workflows and this file together on a bump. `check-pinned-inputs` also checks
# each value's format and requires scripts/ci/load-tool-pins.sh to read this
# file exactly as the Go parser does. The ORAS pins are recorded here for the
# release signer; until the release workflow reads them from here, the release
# workflow env holds the copy that the signer contract covers.
#
# Keep the format strict: blank lines, `#` comments, the [tool_pins] header and
# `key = "value"` lines only. Versions are stored exactly as the consumers use
# them (actionlint, zizmor and ORAS versions have no leading `v`).

