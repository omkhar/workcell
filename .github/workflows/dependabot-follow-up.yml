name: Dependabot follow-up

# Regenerates the fixtures that a Dependabot bump leaves stale: the action
# inputs table (a GitHub Action bump) and the flag inventory stamps (a provider
# CLI bump). The job builds the tools from the PR base commit, which is
# reviewed main, and reads the bump tree only as data. It holds a read-only
# token, passes no token to any step, and has no secrets. It pushes nothing:
# it uploads the patch for a signed host-side commit. See
# docs/github-workflows.md.
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions: {}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: Regenerate Dependabot fixtures
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the reviewed base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      - name: Check out the bump tree as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false

      # The runner image makes /opt world-writable, so its tool-cache go fails
      # the trusted-go storage rule; stage the go.mod toolchain root-owned.
      - name: Stage a root-owned Go toolchain
        run: trusted/scripts/ci/stage-trusted-go.sh

      # The tools come from the reviewed base; the bump tree is only input.
      # Their messages can quote bump content, so the runner reads no
      # workflow command from this step.
      - name: Regenerate the fixtures
        working-directory: trusted
        run: |
          stop_token="$(cat /proc/sys/kernel/random/uuid)"
          echo "::stop-commands::${stop_token}"
          /usr/local/go/bin/go run -trimpath ./cmd/workcell-citools refresh-action-inputs ../head
          /usr/local/go/bin/go run -trimpath ./cmd/workcell-citools flag-inventory restamp ../head
          mkdir -p "${RUNNER_TEMP}/follow-up"
          git -C ../head diff --no-ext-diff --no-textconv -- tests/fixtures/actions/inputs.tsv tests/fixtures/flags \
            >"${RUNNER_TEMP}/follow-up/dependabot-follow-up.patch"
          echo "::${stop_token}::"

      - name: Upload the patch
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependabot-follow-up
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/follow-up/dependabot-follow-up.patch

      - name: Report the patch
        run: |
          patch="${RUNNER_TEMP}/follow-up/dependabot-follow-up.patch"
          if [[ ! -s "${patch}" ]]; then
            echo "The bump leaves no fixture stale."
            exit 0
          fi
          {
            echo "### Stale fixtures"
            echo "Apply the dependabot-follow-up artifact on the bump branch, then sign and push the commit."
            echo '```diff'
            cat "${patch}"
            echo '```'
          } >>"${GITHUB_STEP_SUMMARY}"
          echo "::error::The bump leaves fixtures stale. Apply the dependabot-follow-up artifact, sign the commit, and push it."
          exit 1
