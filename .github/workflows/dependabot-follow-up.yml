name: Dependabot follow-up

# Builds the action inputs patch a Dependabot action bump needs, with tools
# from the reviewed base and the bump tree read only as data. Read-only token,
# no secrets, no push: the daily Dependabot check verifies, signs and pushes
# the patch. See docs/github-workflows.md.
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/**

permissions: {}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: Regenerate Dependabot fixtures
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the reviewed base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      - name: Check out the bump tree as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false

      # The runner image makes /opt world-writable, so its tool-cache go fails
      # the trusted-go storage rule; stage the go.mod toolchain root-owned.
      - name: Stage a root-owned Go toolchain
        run: trusted/scripts/ci/stage-trusted-go.sh

      # The tools come from the reviewed base; the bump tree is only input.
      # Their messages can quote bump content, so the runner reads no
      # workflow command from this step.
      - name: Regenerate the action inputs table
        id: regenerate
        working-directory: trusted
        run: |
          stop_token="$(cat /proc/sys/kernel/random/uuid)"
          echo "::stop-commands::${stop_token}"
          /usr/local/go/bin/go run -trimpath ./cmd/workcell-citools refresh-action-inputs ../head
          /usr/local/go/bin/go run -trimpath ./cmd/workcell-citools refresh-action-inputs --verify . ../head
          mkdir -p "${RUNNER_TEMP}/follow-up"
          # Only tests/fixtures/actions/inputs.tsv; an empty patch of a changed table fails.
          /usr/local/go/bin/go run -trimpath ./cmd/workcell-citools fixture-patch ../head \
            >"${RUNNER_TEMP}/follow-up/inputs.patch"
          echo "::${stop_token}::"
          pending=false
          [[ -s "${RUNNER_TEMP}/follow-up/inputs.patch" ]] && pending=true
          echo "pending=${pending}" >>"${GITHUB_OUTPUT}"

      - name: Upload the patch
        if: steps.regenerate.outputs.pending == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependabot-follow-up
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/follow-up/inputs.patch

      # The job passes; Validate repository stays red until the patch is pushed.
      - name: Report the patch
        env:
          PENDING: ${{ steps.regenerate.outputs.pending }}
        run: |
          if [[ "${PENDING}" != "true" ]]; then
            echo "### No patch needed: the action inputs table matches the bump" >>"${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          patch="${RUNNER_TEMP}/follow-up/inputs.patch"
          added="$(grep -c '^+[^+]' "${patch}" || true)"
          removed="$(grep -c '^-[^-]' "${patch}" || true)"
          {
            echo "### Patch waiting: tests/fixtures/actions/inputs.tsv"
            echo "The \`dependabot-follow-up\` artifact adds ${added} and removes ${removed} rows."
            echo "The daily Dependabot check verifies it, signs a commit, and pushes it to this branch."
            echo "Added rows (each ref and input name passed the table's character check):"
            echo '```text'
            grep '^+[^+]' "${patch}" | cut -c2-
            echo '```'
          } >>"${GITHUB_STEP_SUMMARY}"
          echo "::notice title=Dependabot follow-up::A patch for tests/fixtures/actions/inputs.tsv is waiting in the dependabot-follow-up artifact."
