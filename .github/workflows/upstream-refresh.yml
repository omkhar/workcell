name: Upstream refresh

on:
  schedule:
    # Daily at 13:15 UTC. Snapshot CVE timing does not respect business
    # hours, so the workflow runs every day rather than Mon-Fri only.
    - cron: "15 13 * * *"
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  WORKCELL_COSIGN_VERSION: v3.1.3

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # A canceled publish could leave an open PR with no merge decision.

jobs:
  refresh:
    name: Refresh pinned upstreams
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20
    outputs:
      candidate: ${{ steps.candidate.outputs.dir != '' }}
    permissions:
      contents: read # Read the reviewed tree to compute the candidate bundle.
      issues: write # Update the rolling tracking issue with the latest candidate status.
      pull-requests: read # Detect overlapping refresh PRs before generating a candidate.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.WORKCELL_COSIGN_VERSION }}

      - name: Expose cosign in trusted system path
        run: sudo install -m 0755 "$(command -v cosign)" /usr/local/bin/cosign

      - name: Summarize provider bumps
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          token_file="$(mktemp "${RUNNER_TEMP}/workcell-github-api-token.XXXXXX")"
          (umask 077 && printf '%s' "${GITHUB_TOKEN}" >"${token_file}")
          unset GITHUB_TOKEN GH_TOKEN
          trap 'rm -f "${token_file}"' EXIT
          mkdir -p "${RUNNER_TEMP}/upstream-refresh-candidate"
          WORKCELL_GITHUB_API_TOKEN_FILE="${token_file}" ./scripts/update-provider-pins.sh >"${RUNNER_TEMP}/upstream-refresh-candidate/provider-summary"

      # One open refresh PR of a kind blocks only a new candidate of that kind.
      - id: existing_pr
        name: Detect overlapping upstream refresh PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prs="$(gh pr list --state open --base main --limit 1000 --json title,url,headRefName,isCrossRepository)"
          for kind in provider toolchain; do
            url="$(jq -L scripts/ci -r --arg kind "${kind}" 'include "upstream-refresh-overlap"; overlap($kind).url // ""' <<<"${prs}")"
            echo "${kind}=${url}" >> "${GITHUB_OUTPUT}"
            [[ -z "${url}" ]] || echo "Upstream ${kind} refresh PR already open: ${url}"
          done

      # The provider candidate holds only provider pins, so the scope guard can
      # pass it. The toolchain candidate holds every other pin.
      - name: Refresh provider pins
        if: steps.existing_pr.outputs.provider == ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          token_file="$(mktemp "${RUNNER_TEMP}/workcell-github-api-token.XXXXXX")"
          (umask 077 && printf '%s' "${GITHUB_TOKEN}" >"${token_file}")
          unset GITHUB_TOKEN GH_TOKEN
          trap 'rm -f "${token_file}"' EXIT
          WORKCELL_GITHUB_API_TOKEN_FILE="${token_file}" ./scripts/update-provider-pins.sh --apply | tee "${RUNNER_TEMP}/upstream-refresh-provider-apply.log"
          WORKCELL_GITHUB_API_TOKEN_FILE="${token_file}" ./scripts/update-provider-pins.sh --check
          ./scripts/check-pinned-inputs.sh
          ./scripts/ci/upstream-refresh-candidate.sh provider "${RUNNER_TEMP}/upstream-refresh-candidate"

      - name: Refresh toolchain pins
        if: steps.existing_pr.outputs.toolchain == ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          token_file="$(mktemp "${RUNNER_TEMP}/workcell-github-api-token.XXXXXX")"
          (umask 077 && printf '%s' "${GITHUB_TOKEN}" >"${token_file}")
          unset GITHUB_TOKEN GH_TOKEN
          trap 'rm -f "${token_file}"' EXIT
          WORKCELL_GITHUB_API_TOKEN_FILE="${token_file}" ./scripts/update-upstream-pins.sh --apply --toolchain-only | tee "${RUNNER_TEMP}/upstream-refresh-apply.log"
          WORKCELL_GITHUB_API_TOKEN_FILE="${token_file}" ./scripts/update-upstream-pins.sh --check --toolchain-only
          ./scripts/check-pinned-inputs.sh
          ./scripts/ci/upstream-refresh-candidate.sh toolchain "${RUNNER_TEMP}/upstream-refresh-candidate"

      - id: candidate
        name: Collect candidates
        run: |
          candidate_dir="${RUNNER_TEMP}/upstream-refresh-candidate"
          if compgen -G "${candidate_dir}/*/metadata.json" >/dev/null; then
            echo "dir=${candidate_dir}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Upload candidate artifact
        if: steps.candidate.outputs.dir != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-refresh-candidate
          if-no-files-found: error
          path: |
            ${{ steps.candidate.outputs.dir }}/*/patch
            ${{ steps.candidate.outputs.dir }}/*/diffstat
            ${{ steps.candidate.outputs.dir }}/*/metadata.json
            ${{ steps.candidate.outputs.dir }}/provider-summary
          retention-days: 7

      - name: Update tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REFRESH_PROVIDER_PR: ${{ steps.existing_pr.outputs.provider }}
          REFRESH_TOOLCHAIN_PR: ${{ steps.existing_pr.outputs.toolchain }}
          CANDIDATE_DIR: ${{ runner.temp }}/upstream-refresh-candidate
        run: |
          tracking_label="upstream-refresh-candidate"
          tracking_title="Upstream refresh candidate"
          issue_body="$(mktemp "${RUNNER_TEMP}/workcell-upstream-refresh-issue.XXXXXX.md")"

          if [[ "$(gh label list --limit 1000 --json name --jq 'map(select(.name == "upstream-refresh-candidate")) | length')" == "0" ]]; then
            gh label create "${tracking_label}" --color "0E8A16" --description "Latest upstream refresh candidate tracking issue"
          fi
          # The publish job cannot create labels with its App token.
          if [[ "$(gh label list --limit 1000 --json name --jq 'map(select(.name == "needs-human-review")) | length')" == "0" ]]; then
            gh label create needs-human-review --color "D93F0B" --description "Human review required before merge"
          fi

          {
            echo "## Latest result"
            echo
            echo "- generated: \`$(date -u +%Y-%m-%dT%H:%M:%SZ)\`"
            echo "- run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- base ref: \`${GITHUB_REF}\`"
            echo "- base sha: \`$(git rev-parse HEAD)\`"
            for kind in provider toolchain; do
              existing_pr_var="REFRESH_${kind^^}_PR"
              metadata_path="${CANDIDATE_DIR}/${kind}/metadata.json"
              echo
              echo "## ${kind^} candidate"
              echo
              if [[ -n "${!existing_pr_var}" ]]; then
                echo "Skipped, because a ${kind} refresh PR is already open: ${!existing_pr_var}"
                continue
              fi
              if [[ ! -f "${metadata_path}" ]]; then
                echo "No ${kind} refresh changes were detected."
                continue
              fi
              echo "- patch sha256: \`$(jq -r '.patch_sha256' "${metadata_path}")\`"
              echo "- tree oid: \`$(jq -r '.tree_oid' "${metadata_path}")\`"
              echo
              echo "Changed files:"
              echo
              jq -r '.changed_files[] | "- `" + . + "`"' "${metadata_path}"
              echo
              echo '```'
              cat "${CANDIDATE_DIR}/${kind}/diffstat"
              echo '```'
              # The App has no Workflows permission, so a person publishes this candidate.
              if jq -e 'any(.changed_files[]; startswith(".github/workflows/"))' "${metadata_path}" >/dev/null; then
                echo
                echo "This candidate changes \`.github/workflows/\`. The App does not publish it. Publish it from a host:"
                echo
                echo '```'
                echo "./scripts/publish-upstream-refresh-pr.sh --run-id ${GITHUB_RUN_ID} --candidate ${kind}"
                echo '```'
              fi
            done
          } > "${issue_body}"

          # Held releases show in every result, not only the no-change one.
          held_lines="$(cat "${RUNNER_TEMP}"/upstream-refresh-*apply.log 2>/dev/null | grep 'unclassified-cli-surface' | sed 's/^ */- /' | sort -u || true)"
          if [[ -n "${held_lines}" ]]; then
            {
              echo
              echo "## Held for manual classification"
              echo
              echo "${held_lines}"
            } >>"${issue_body}"
          fi

          issues_json="$(
            gh issue list \
              --state all \
              --label "${tracking_label}" \
              --limit 10 \
              --json number,state
          )"
          issue_count="$(jq 'length' <<<"${issues_json}")"
          if [[ "${issue_count}" -gt 1 ]]; then
            echo "Expected at most one ${tracking_label} issue, found ${issue_count}." >&2
            exit 1
          fi
          if [[ "${issue_count}" -eq 0 ]]; then
            gh issue create --title "${tracking_title}" --body-file "${issue_body}" --label "${tracking_label}" >/dev/null
            exit 0
          fi

          issue_number="$(jq -r '.[0].number' <<<"${issues_json}")"
          issue_state="$(jq -r '.[0].state | ascii_downcase' <<<"${issues_json}")"
          if [[ "${issue_state}" == "closed" ]]; then
            gh issue reopen "${issue_number}" >/dev/null
          fi
          gh issue edit "${issue_number}" --title "${tracking_title}" --body-file "${issue_body}" --add-label "${tracking_label}" >/dev/null

  scope-guard:
    name: Check bump scope
    needs: refresh
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && needs.refresh.outputs.candidate == 'true'
    timeout-minutes: 5
    outputs:
      # The guard step outcome is the guard's real exit status.
      result: ${{ steps.guard.outcome == 'success' && 'passed' || 'failed' }}
    permissions:
      contents: read # Read the reviewed scope-guard script.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: upstream-refresh-candidate
          path: ${{ runner.temp }}/candidate

      # A failed guard is a result: publish then opens a PR for human review.
      # Only the provider candidate can pass. A missing one fails the guard.
      - id: guard
        name: Run scope guard
        shell: bash --noprofile --norc -euo pipefail {0}
        continue-on-error: true
        run: ./scripts/ci/upstream-refresh-scope-guard.sh "${RUNNER_TEMP}/candidate/provider/patch"

  publish:
    name: Publish upstream refresh PR
    needs: [refresh, scope-guard]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && needs.refresh.outputs.candidate == 'true'
    timeout-minutes: 15
    environment:
      name: upstream-refresh
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    permissions:
      contents: read # Check out the candidate base. The App token does all writes.
      issues: write # Post the audit comment on the tracking issue.
    steps:
      - id: secrets
        name: Check App credentials
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          APP_CLIENT_ID: ${{ secrets.WORKCELL_UPSTREAM_REFRESH_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.WORKCELL_UPSTREAM_REFRESH_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "${APP_CLIENT_ID}" || -z "${APP_PRIVATE_KEY}" ]]; then
            echo "present=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::The upstream-refresh App credentials are not configured. Publication is skipped. See docs/github-workflows.md."
            exit 0
          fi
          echo "present=true" >> "${GITHUB_OUTPUT}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.secrets.outputs.present == 'true'
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.secrets.outputs.present == 'true'
        with:
          name: upstream-refresh-candidate
          path: ${{ runner.temp }}/candidate
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        if: steps.secrets.outputs.present == 'true'
        with:
          client-id: ${{ secrets.WORKCELL_UPSTREAM_REFRESH_APP_CLIENT_ID }}
          private-key: ${{ secrets.WORKCELL_UPSTREAM_REFRESH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - id: publish
        name: Publish candidate
        shell: bash --noprofile --norc -euo pipefail {0}
        if: steps.secrets.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SCOPE_GUARD_RESULT: ${{ needs.scope-guard.outputs.result }}
        run: ./scripts/ci/upstream-refresh-publish.sh "${RUNNER_TEMP}/candidate" "${SCOPE_GUARD_RESULT}" "${RUNNER_TEMP}/audit.md"
      - name: Post audit comment
        if: always() && steps.secrets.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ -s "${RUNNER_TEMP}/audit.md" ]] || exit 0
          issue_number="$(gh issue list --state all --label upstream-refresh-candidate --limit 1 --json number --jq '.[0].number // empty')"
          [[ -n "${issue_number}" ]] || exit 0
          gh issue comment "${issue_number}" --body-file "${RUNNER_TEMP}/audit.md"
