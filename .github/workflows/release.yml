name: Release

on:
  repository_dispatch:
    types: [release]

permissions: {}

# Apply strict bash mode (`-euo pipefail`) to every multi-line `run:`
# block.  GitHub's default bash invocation gives `-eo pipefail` but
# leaves `-u` off — release.yml's signing and publish steps interpolate
# many env vars (e.g. ${BUNDLE_NAME}, ${IMAGE_DIGEST}) that would sign
# an empty path on an unset variable.  Default-on is safer than relying
# on every author to remember `set -euo pipefail`.
defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.client_payload.tag }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  WORKCELL_BUILDKIT_IMAGE: moby/buildkit:buildx-stable-1@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
  WORKCELL_BUILDX_VERSION: v0.37.0
  WORKCELL_COSIGN_VERSION: v3.1.3
  WORKCELL_QEMU_IMAGE: tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
  WORKCELL_SYFT_VERSION: v1.51.1

jobs:
  tag-policy:
    name: Release tag policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # Verify the required workflow runs for the release commit.
      contents: read # Verify the annotated release tag and its target commit.
    outputs:
      release_commit: ${{ steps.binding.outputs.release_commit }}
      release_tag: ${{ steps.binding.outputs.release_tag }}
      tag_object: ${{ steps.binding.outputs.tag_object }}
    steps:
      - name: Verify signed tag binding before checkout
        id: binding
        env:
          GH_HOST: github.com
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
          RELEASE_TAG: ${{ github.event.client_payload.tag }}
          EXPECTED_RELEASE_COMMIT: ${{ github.event.client_payload.commit }}
        run: |
          # repository_dispatch loads this workflow from the default branch.
          # This gate uses only fixed runner tools before repository checkout.
          export PATH="/usr/bin:/bin"
          expected_workflow_ref="${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/main"
          if [[ "${GITHUB_REF}" != "refs/heads/main" || "${GITHUB_WORKFLOW_REF}" != "${expected_workflow_ref}" ||
            "${GITHUB_WORKFLOW_SHA}" != "${GITHUB_SHA}" ]]; then
            echo "Release must use the workflow from the current main commit." >&2
            exit 2
          fi
          payload_keys="$(jq -c 'keys | sort' <<<"${PAYLOAD_JSON}")"
          if [[ "${payload_keys}" != '["commit","tag"]' ]]; then
            echo "Release dispatch accepts only tag and commit payload fields." >&2
            exit 2
          fi
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9A-Za-z.-]{1,63}$ ]]; then
            echo "Release dispatch requires one bounded release tag." >&2
            exit 2
          fi
          if [[ "${#EXPECTED_RELEASE_COMMIT}" -ne 40 || "${EXPECTED_RELEASE_COMMIT}" == *[!0-9a-f]* ]]; then
            echo "Release dispatch requires client_payload.commit as 40 lowercase hexadecimal characters." >&2
            exit 2
          fi
          encoded_tag="$(jq -rn --arg value "${RELEASE_TAG}" '$value | @uri')"
          ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${encoded_tag}")"
          observed_ref="$(jq -r '.ref // empty' <<<"${ref_json}")"
          object_type="$(jq -r '.object.type // empty' <<<"${ref_json}")"
          object_sha="$(jq -r '.object.sha // empty' <<<"${ref_json}")"
          if [[ "${observed_ref}" != "refs/tags/${RELEASE_TAG}" || "${object_type}" != "tag" ]]; then
            echo "Release requires an annotated tag object." >&2
            exit 2
          fi
          if [[ "${#object_sha}" -ne 40 || "${object_sha}" == *[!0-9a-f]* ]]; then
            echo "Release tag object has an invalid object ID." >&2
            exit 2
          fi
          tag_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}")"
          returned_object_sha="$(jq -r '.sha // empty' <<<"${tag_json}")"
          returned_tag_name="$(jq -r '.tag // empty' <<<"${tag_json}")"
          target_type="$(jq -r '.object.type // empty' <<<"${tag_json}")"
          target_sha="$(jq -r '.object.sha // empty' <<<"${tag_json}")"
          verified="$(jq -r '.verification.verified // false' <<<"${tag_json}")"
          reason="$(jq -r '.verification.reason // "unknown"' <<<"${tag_json}")"
          if [[ "${verified}" != "true" || "${reason}" != "valid" ]]; then
            echo "Release requires a GitHub-verified signed tag." >&2
            exit 2
          fi
          if [[ "${returned_object_sha}" != "${object_sha}" || "${returned_tag_name}" != "${RELEASE_TAG}" ||
            "${target_type}" != "commit" || "${target_sha}" != "${EXPECTED_RELEASE_COMMIT}" ]]; then
            echo "Release tag does not target the requested release commit." >&2
            exit 2
          fi
          if [[ "${target_sha}" != "${GITHUB_WORKFLOW_SHA}" ]]; then
            echo "Release tag must target the current main workflow commit." >&2
            exit 2
          fi
          runs_response="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&event=push&head_sha=${target_sha}&per_page=100")"
          run_count="$(jq -r '.total_count // -1' <<<"${runs_response}")"
          if [[ ! "${run_count}" =~ ^[0-9]+$ || "${run_count}" -gt 100 ]]; then
            echo "Release commit workflow-run inventory is invalid or exceeds 100 entries." >&2
            exit 2
          fi
          main_runs="$(jq --arg target "${target_sha}" \
            '[.workflow_runs[]
              | select(.event == "push" and .head_branch == "main" and .head_sha == $target)]
              | group_by(.path)
              | map(max_by([.id, .run_attempt]))' \
            <<<"${runs_response}")"
          expected_paths='[".github/workflows/ci.yml",".github/workflows/codeql.yml",".github/workflows/docs.yml",".github/workflows/hosted-controls.yml",".github/workflows/scorecard.yml",".github/workflows/security.yml"]'
          observed_paths="$(jq -c '[.[].path] | sort' <<<"${main_runs}")"
          if [[ "${observed_paths}" != "${expected_paths}" ]]; then
            echo "Release commit does not have the exact required main workflow set." >&2
            printf 'Expected: %s\nObserved: %s\n' "${expected_paths}" "${observed_paths}" >&2
            exit 2
          fi
          unready_runs="$(jq -r \
            '.[] | select(.status != "completed" or .conclusion != "success") | "\(.name) (\(.status), \(.conclusion))"' \
            <<<"${main_runs}")"
          if [[ -n "${unready_runs}" ]]; then
            echo "Release commit has incomplete or unsuccessful main workflows:" >&2
            printf '%s\n' "${unready_runs}" >&2
            exit 2
          fi
          {
            echo "release_commit=${target_sha}"
            echo "release_tag=${RELEASE_TAG}"
            echo "tag_object=${object_sha}"
          } >>"${GITHUB_OUTPUT}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Classify release tag
        env:
          RELEASE_TAG: ${{ steps.binding.outputs.release_tag }}
        run: go run ./cmd/workcell-hostutil release classify-tag "${RELEASE_TAG}" >/dev/null

  codeql-preflight:
    name: Release CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: tag-policy
    permissions:
      actions: read # Read workflow metadata required by CodeQL helper actions.
      contents: read
      security-events: write # Upload SARIF results to GitHub code scanning.
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: go
            build-mode: autobuild
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag-policy.outputs.release_commit }}
          persist-credentials: false

      - if: ${{ !github.event.repository.private || vars.WORKCELL_ENABLE_PRIVATE_CODE_SCANNING == 'true' }}
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - if: ${{ (!github.event.repository.private || vars.WORKCELL_ENABLE_PRIVATE_CODE_SCANNING == 'true') && matrix.build-mode == 'autobuild' }}
        uses: github/codeql-action/autobuild@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8

      - if: ${{ !github.event.repository.private || vars.WORKCELL_ENABLE_PRIVATE_CODE_SCANNING == 'true' }}
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8

  preflight-arm64-repro:
    name: Release reproducible image (arm64)
    # Build and reproducibility-verify the linux/arm64 runtime image on a
    # native arm64 runner instead of QEMU emulation.  The amd64 lane stays in
    # the main `preflight` job (native on ubuntu-latest); this job feeds its
    # verified arm64 image/config digests back via job outputs so preflight can
    # assemble the combined runtime manifest that publish checks against.  This
    # mirrors the already-reviewed native arm64 lane in ci.yml.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    needs: tag-policy
    env:
      RELEASE_COMMIT: ${{ needs.tag-policy.outputs.release_commit }}
    permissions:
      contents: read
    outputs:
      image_manifest_digest: ${{ steps.repro.outputs.image_manifest_digest }}
      config_digest: ${{ steps.repro.outputs.config_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.tag-policy.outputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false

      - id: source_date
        name: Compute source date epoch
        run: echo "epoch=$(git log -1 --pretty=%ct "${RELEASE_COMMIT}")" >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          cache-binary: false
          driver-opts: image=${{ env.WORKCELL_BUILDKIT_IMAGE }}
          version: ${{ env.WORKCELL_BUILDX_VERSION }}

      - id: repro
        name: Verify reproducible arm64 runtime image
        env:
          WORKCELL_REPRO_PLATFORMS: linux/arm64
          WORKCELL_REPRO_MANIFEST_PATH: dist/workcell-runtime-arm64.json
          SOURCE_DATE_EPOCH: ${{ steps.source_date.outputs.epoch }}
        run: |
          ./scripts/verify-reproducible-build.sh
          manifest_digest="$(jq -r '.platforms["linux/arm64"].image_manifest_digest' dist/workcell-runtime-arm64.json)"
          config_digest="$(jq -r '.platforms["linux/arm64"].config_digest' dist/workcell-runtime-arm64.json)"
          if [[ "${manifest_digest}" != sha256:* || "${config_digest}" != sha256:* ]]; then
            echo "Malformed arm64 reproducible-build digests: manifest=${manifest_digest} config=${config_digest}" >&2
            exit 1
          fi
          echo "image_manifest_digest=${manifest_digest}" >> "${GITHUB_OUTPUT}"
          echo "config_digest=${config_digest}" >> "${GITHUB_OUTPUT}"

      - name: Verify upstream Copilot release on native arm64
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKCELL_COPILOT_RELEASE_HELP_MODE: native
        run: |
          token_file="$(umask 077 && mktemp "${RUNNER_TEMP}/workcell-github-token.XXXXXX")"; trap 'rm -f "${token_file}"' EXIT
          (umask 077 && printf '%s' "${GITHUB_TOKEN}" >"${token_file}")
          unset GITHUB_TOKEN GH_TOKEN
          WORKCELL_GITHUB_API_TOKEN_FILE="${token_file}" ./scripts/verify-upstream-copilot-release.sh

  preflight-amd64-repro:
    name: Release reproducible image (amd64)
    # Build and reproducibility-verify the linux/amd64 runtime image in its own
    # native job (mirroring preflight-arm64-repro) so it runs in parallel with
    # the rest of preflight instead of serially inside it.  Feeds its verified
    # image/config digests back via job outputs; preflight assembles the
    # combined runtime manifest that publish checks against.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: tag-policy
    env:
      RELEASE_COMMIT: ${{ needs.tag-policy.outputs.release_commit }}
    permissions:
      contents: read
    outputs:
      image_manifest_digest: ${{ steps.repro.outputs.image_manifest_digest }}
      config_digest: ${{ steps.repro.outputs.config_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.tag-policy.outputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false

      - id: source_date
        name: Compute source date epoch
        run: echo "epoch=$(git log -1 --pretty=%ct "${RELEASE_COMMIT}")" >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          cache-binary: false
          driver-opts: image=${{ env.WORKCELL_BUILDKIT_IMAGE }}
          version: ${{ env.WORKCELL_BUILDX_VERSION }}

      - id: repro
        name: Verify reproducible amd64 runtime image
        env:
          WORKCELL_REPRO_PLATFORMS: linux/amd64
          WORKCELL_REPRO_MANIFEST_PATH: dist/workcell-runtime-amd64.json
          SOURCE_DATE_EPOCH: ${{ steps.source_date.outputs.epoch }}
        run: |
          ./scripts/verify-reproducible-build.sh
          manifest_digest="$(jq -r '.platforms["linux/amd64"].image_manifest_digest' dist/workcell-runtime-amd64.json)"
          config_digest="$(jq -r '.platforms["linux/amd64"].config_digest' dist/workcell-runtime-amd64.json)"
          if [[ "${manifest_digest}" != sha256:* || "${config_digest}" != sha256:* ]]; then
            echo "Malformed amd64 reproducible-build digests: manifest=${manifest_digest} config=${config_digest}" >&2
            exit 1
          fi
          echo "image_manifest_digest=${manifest_digest}" >> "${GITHUB_OUTPUT}"
          echo "config_digest=${config_digest}" >> "${GITHUB_OUTPUT}"

  preflight-container-smoke:
    name: Release container smoke
    # Run the container smoke check in its own job so it overlaps the rest of
    # preflight instead of running serially inside it.  Gates publish via the
    # `needs` of build-arm64-image and release below.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: tag-policy
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.tag-policy.outputs.release_commit }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          cache-binary: false
          driver-opts: image=${{ env.WORKCELL_BUILDKIT_IMAGE }}
          version: ${{ env.WORKCELL_BUILDX_VERSION }}

      - name: Run container smoke
        run: ./scripts/container-smoke.sh

      - name: Verify upstream Copilot release inside runtime image
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKCELL_COPILOT_RELEASE_HELP_IMAGE: workcell:smoke
          WORKCELL_COPILOT_RELEASE_HELP_MODE: docker
        run: |
          token_file="$(umask 077 && mktemp "${RUNNER_TEMP}/workcell-github-token.XXXXXX")"; trap 'rm -f "${token_file}"' EXIT
          (umask 077 && printf '%s' "${GITHUB_TOKEN}" >"${token_file}")
          unset GITHUB_TOKEN GH_TOKEN
          WORKCELL_GITHUB_API_TOKEN_FILE="${token_file}" ./scripts/verify-upstream-copilot-release.sh

  preflight-arm64-copilot-runtime:
    name: Release Copilot runtime image probe (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    needs: tag-policy
    env:
      RELEASE_COMMIT: ${{ needs.tag-policy.outputs.release_commit }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.tag-policy.outputs.release_commit }}
          persist-credentials: false

      - id: source_date
        name: Compute source date epoch
        run: echo "epoch=$(git log -1 --pretty=%ct "${RELEASE_COMMIT}")" >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          cache-binary: false
          driver-opts: image=${{ env.WORKCELL_BUILDKIT_IMAGE }}
          version: ${{ env.WORKCELL_BUILDX_VERSION }}

      - name: Build arm64 runtime image for Copilot help probe
        env:
          SOURCE_DATE_EPOCH: ${{ steps.source_date.outputs.epoch }}
        # No BUILDKIT_MULTI_PLATFORM here: it forces a manifest-list output,
        # which `--load` (the docker exporter) rejects on buildx v0.35.0+.
        # This probe only runs the loaded image; it does not compare digests
        # against the reproducible-build manifest, so list packaging is not
        # needed.
        run: |
          docker buildx build \
            --build-arg "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}" \
            --load \
            --platform linux/arm64 \
            --tag workcell:copilot-arm64-smoke \
            -f runtime/container/Dockerfile \
            .

      - name: Verify upstream Copilot release inside arm64 runtime image
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKCELL_COPILOT_RELEASE_HELP_IMAGE: workcell:copilot-arm64-smoke
          WORKCELL_COPILOT_RELEASE_HELP_MODE: docker
        run: |
          token_file="$(umask 077 && mktemp "${RUNNER_TEMP}/workcell-github-token.XXXXXX")"; trap 'rm -f "${token_file}"' EXIT
          (umask 077 && printf '%s' "${GITHUB_TOKEN}" >"${token_file}")
          unset GITHUB_TOKEN GH_TOKEN
          WORKCELL_GITHUB_API_TOKEN_FILE="${token_file}" ./scripts/verify-upstream-copilot-release.sh

  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs:
      - tag-policy
      - preflight-amd64-repro
      - preflight-arm64-repro
    env:
      RELEASE_TAG: ${{ needs.tag-policy.outputs.release_tag }}
      RELEASE_COMMIT: ${{ needs.tag-policy.outputs.release_commit }}
      RELEASE_TAG_OBJECT: ${{ needs.tag-policy.outputs.tag_object }}
    environment:
      name: hosted-controls-audit
    permissions:
      actions: read # Read workflow metadata needed by artifact and code-scanning actions.
      contents: read
      security-events: write # Upload SARIF results produced during release preflight scans.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.tag-policy.outputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false

      - id: source_date
        name: Compute source date epoch
        run: echo "epoch=$(git log -1 --pretty=%ct "${RELEASE_COMMIT}")" >> "${GITHUB_OUTPUT}"

      - name: Verify release tag signature
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/check-release-tag-signature.sh --github-repo "${GITHUB_REPOSITORY}" --repo-root "${GITHUB_WORKSPACE}" --tag "${RELEASE_TAG}" --expected-commit "${RELEASE_COMMIT}" --expected-tag-object "${RELEASE_TAG_OBJECT}"

      - name: Verify GitHub-hosted controls
        env:
          WORKCELL_HOSTED_CONTROLS_REQUIRED: "1"
          WORKCELL_HOSTED_CONTROLS_TOKEN: ${{ secrets.WORKCELL_HOSTED_CONTROLS_TOKEN }}
        run: ./scripts/run-hosted-controls-audit.sh "${GITHUB_REPOSITORY}"

      - name: Check pinned input policy
        run: ./scripts/check-pinned-inputs.sh

      - name: Verify GitHub macOS release test runners
        run: ./scripts/verify-github-macos-release-test-runners.sh macos-26 macos-15

      - name: Verify build input manifest
        env:
          SOURCE_DATE_EPOCH: ${{ steps.source_date.outputs.epoch }}
          WORKCELL_BUILD_INPUT_REF: ${{ needs.tag-policy.outputs.release_commit }}
        run: ./scripts/verify-build-input-manifest.sh

      - name: Verify control-plane manifest
        run: ./scripts/verify-control-plane-manifest.sh

      - name: Generate preflight build input manifest
        env:
          SOURCE_DATE_EPOCH: ${{ steps.source_date.outputs.epoch }}
          WORKCELL_BUILD_INPUT_REF: ${{ needs.tag-policy.outputs.release_commit }}
        run: |
          mkdir -p dist
          ./scripts/generate-build-input-manifest.sh dist/workcell-build-inputs-preflight.json

      - name: Generate preflight control-plane manifest
        run: |
          mkdir -p dist
          ./scripts/generate-control-plane-manifest.sh dist/workcell-control-plane-preflight.json

      - name: Install actionlint
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ACTIONLINT_VERSION: 1.7.12
        run: |
          actionlint_archive="${RUNNER_TEMP}/actionlint.tar.gz"
          actionlint_bin="${RUNNER_TEMP}/actionlint"
          curl -fsSL \
            --retry 3 \
            --retry-delay 2 \
            --retry-connrefused \
            --max-time 60 \
            --connect-timeout 15 \
            --max-filesize 209715200 \
            -o "${actionlint_archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${actionlint_archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "${actionlint_archive}" -C "${RUNNER_TEMP}" actionlint
          install -m 0755 "${actionlint_bin}" "${RUNNER_TEMP}/bin/actionlint"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.WORKCELL_COSIGN_VERSION }}

      - name: Expose cosign in trusted system path
        run: |
          sudo install -m 0755 "$(command -v cosign)" /usr/local/bin/cosign

      - name: Verify upstream Codex release
        run: ./scripts/verify-upstream-codex-release.sh

      - name: Verify upstream Claude release
        run: ./scripts/verify-upstream-claude-release.sh

      - name: Verify upstream Copilot release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKCELL_COPILOT_RELEASE_HELP_MODE: native
        run: |
          token_file="$(umask 077 && mktemp "${RUNNER_TEMP}/workcell-github-token.XXXXXX")"; trap 'rm -f "${token_file}"' EXIT
          (umask 077 && printf '%s' "${GITHUB_TOKEN}" >"${token_file}")
          unset GITHUB_TOKEN GH_TOKEN
          WORKCELL_GITHUB_API_TOKEN_FILE="${token_file}" ./scripts/verify-upstream-copilot-release.sh

      - name: Verify upstream Gemini release
        run: ./scripts/verify-upstream-gemini-release.sh

      - name: Require pinned upstreams to match the latest reviewed track
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          token_file="$(umask 077 && mktemp "${RUNNER_TEMP}/workcell-github-token.XXXXXX")"; trap 'rm -f "${token_file}"' EXIT
          (umask 077 && printf '%s' "${GITHUB_TOKEN}" >"${token_file}")
          unset GITHUB_TOKEN GH_TOKEN
          WORKCELL_GITHUB_API_TOKEN_FILE="${token_file}" ./scripts/update-upstream-pins.sh --check

      - name: Build validation tool image
        run: |
          docker build \
            -f tools/validator/Dockerfile \
            -t "workcell-validator:${RELEASE_COMMIT}" \
            .

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          cache-binary: false
          driver-opts: image=${{ env.WORKCELL_BUILDKIT_IMAGE }}
          version: ${{ env.WORKCELL_BUILDX_VERSION }}

      - name: Validate repository
        run: |
          set -euo pipefail
          validator_uid="$(id -u)"
          validator_gid="$(id -g)"
          validator_home="/tmp/workcell-home-${validator_uid}"
          validator_cache="${validator_home}/.cache"
          validator_tmp="${validator_home}/.tmp"
          docker run --rm \
            --user "${validator_uid}:${validator_gid}" \
            --entrypoint /bin/bash \
            -v "${PWD}:/workspace" \
            -w /workspace \
            -e HOME="${validator_home}" \
            -e XDG_CACHE_HOME="${validator_cache}" \
            -e GOCACHE="${validator_cache}/go-build" \
            -e GOMODCACHE="${validator_cache}/go-mod" \
            -e CARGO_TARGET_DIR="${validator_cache}/cargo-target" \
            -e TMPDIR="${validator_tmp}" \
            "workcell-validator:${RELEASE_COMMIT}" \
            -lc '
              set -euo pipefail
              mkdir -p "${HOME}" "${XDG_CACHE_HOME}" "${GOCACHE}" "${GOMODCACHE}" "${CARGO_TARGET_DIR}" "${TMPDIR}"
              ./scripts/validate-repo.sh
            '

      - name: Verify host launcher invariants
        run: ./scripts/verify-invariants.sh

      - name: Verify release bundle reproducibility
        env:
          SOURCE_DATE_EPOCH: ${{ steps.source_date.outputs.epoch }}
          WORKCELL_RELEASE_BUNDLE_MANIFEST_PATH: dist/workcell-release-bundle-preflight.json
          WORKCELL_RELEASE_BUNDLE_NAME: workcell-${{ env.RELEASE_TAG }}.tar.gz
          WORKCELL_RELEASE_BUNDLE_PREFIX: workcell-${{ env.RELEASE_TAG }}
          WORKCELL_RELEASE_BUNDLE_REF: ${{ needs.tag-policy.outputs.release_commit }}
          WORKCELL_VALIDATOR_IMAGE: workcell-validator:${{ needs.tag-policy.outputs.release_commit }}
        run: ./scripts/verify-release-bundle.sh

      - name: Build preflight release install artifacts
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_DATE_EPOCH: ${{ steps.source_date.outputs.epoch }}
        run: |
          set -euo pipefail
          validator_uid="$(id -u)"
          validator_gid="$(id -g)"
          validator_home="/tmp/workcell-home-${validator_uid}"
          validator_cache="${validator_home}/.cache"
          validator_tmp="${validator_home}/.tmp"
          mkdir -p dist/release-install
          bundle="workcell-${RELEASE_TAG}.tar.gz"
          docker run --rm \
            --user "${validator_uid}:${validator_gid}" \
            --entrypoint /bin/bash \
            -v "${PWD}:/workspace" \
            -v "${PWD}/dist/release-install:/dist" \
            -w /workspace \
            -e HOME="${validator_home}" \
            -e XDG_CACHE_HOME="${validator_cache}" \
            -e TMPDIR="${validator_tmp}" \
            -e SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH}" \
            -e ARCHIVE_REF="${RELEASE_COMMIT}" \
            -e BUNDLE_NAME="${bundle}" \
            -e BUNDLE_PREFIX="workcell-${RELEASE_TAG}/" \
            "workcell-validator:${RELEASE_COMMIT}" \
            -lc '
              set -euo pipefail
              mkdir -p "${HOME}" "${XDG_CACHE_HOME}" "${TMPDIR}"
              bundle_tar="/dist/${BUNDLE_NAME%.tar.gz}.tar"
              git -c safe.directory=/workspace archive \
                --format=tar \
                --mtime="@${SOURCE_DATE_EPOCH}" \
                --prefix="${BUNDLE_PREFIX}" \
                -o "${bundle_tar}" \
                "${ARCHIVE_REF}"
              gzip -n -9 < "${bundle_tar}" > "/dist/${BUNDLE_NAME}"
              rm -f "${bundle_tar}"
            '
          bundle_sha="$(sha256sum "dist/release-install/${bundle}" | awk '{print $1}')"
          ./scripts/generate-homebrew-formula.sh \
            "${RELEASE_TAG}" \
            "${bundle_sha}" \
            dist/release-install/workcell.rb \
            --repository "${GITHUB_REPOSITORY}"

      - name: Run actionlint
        run: actionlint

      - name: Install zizmor
        env:
          ZIZMOR_SHA256: ec8c95cd800845abb9bbc5f377ec7c57d2eb8e2386a00a201d3a74ee4092e5ed
          ZIZMOR_VERSION: 1.30.0
        run: |
          curl -fsSL \
            --retry 3 \
            --retry-delay 2 \
            --retry-connrefused \
            --max-time 60 \
            --connect-timeout 15 \
            --max-filesize 209715200 \
            -o zizmor.tar.gz \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  zizmor.tar.gz" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf zizmor.tar.gz -C "${RUNNER_TEMP}/bin" zizmor
          chmod 0755 "${RUNNER_TEMP}/bin/zizmor"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Run GitHub Actions security analysis
        run: |
          zizmor \
            --persona auditor \
            --config .github/zizmor.yml \
            .github/workflows

      - name: Assemble reproducible-build preflight manifest
        # The amd64 and arm64 runtime images are now built and
        # reproducibility-verified in the parallel preflight-amd64-repro and
        # preflight-arm64-repro jobs; assemble their verified per-platform
        # digests into the manifest publish byte-compares the published image
        # against.  Fail closed on any missing/malformed digest.
        env:
          AMD64_MANIFEST_DIGEST: ${{ needs.preflight-amd64-repro.outputs.image_manifest_digest }}
          AMD64_CONFIG_DIGEST: ${{ needs.preflight-amd64-repro.outputs.config_digest }}
          ARM64_MANIFEST_DIGEST: ${{ needs.preflight-arm64-repro.outputs.image_manifest_digest }}
          ARM64_CONFIG_DIGEST: ${{ needs.preflight-arm64-repro.outputs.config_digest }}
          SOURCE_DATE_EPOCH: ${{ steps.source_date.outputs.epoch }}
        run: |
          for digest in "${AMD64_MANIFEST_DIGEST}" "${AMD64_CONFIG_DIGEST}" \
            "${ARM64_MANIFEST_DIGEST}" "${ARM64_CONFIG_DIGEST}"; do
            if [[ "${digest}" != sha256:* ]]; then
              echo "Missing or malformed reproducible-build digest from preflight repro jobs: ${digest}" >&2
              exit 1
            fi
          done
          mkdir -p dist
          jq -n \
            --argjson source_date_epoch "${SOURCE_DATE_EPOCH}" \
            --arg amd64_manifest "${AMD64_MANIFEST_DIGEST}" \
            --arg amd64_config "${AMD64_CONFIG_DIGEST}" \
            --arg arm64_manifest "${ARM64_MANIFEST_DIGEST}" \
            --arg arm64_config "${ARM64_CONFIG_DIGEST}" \
            '{
              source_date_epoch: $source_date_epoch,
              platforms: {
                "linux/amd64": {image_manifest_digest: $amd64_manifest, config_digest: $amd64_config},
                "linux/arm64": {image_manifest_digest: $arm64_manifest, config_digest: $arm64_config}
              }
            }' > dist/workcell-runtime-preflight.json

      - name: Upload preflight binding manifests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workcell-release-preflight
          path: |
            dist/workcell-build-inputs-preflight.json
            dist/workcell-control-plane-preflight.json
            dist/workcell-release-bundle-preflight.json
            dist/workcell-runtime-preflight.json
          retention-days: 90

      - name: Upload preflight release install artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workcell-release-install-candidate
          path: |
            dist/release-install/workcell-${{ env.RELEASE_TAG }}.tar.gz
            dist/release-install/workcell.rb
          retention-days: 90

  install-verification:
    name: Release install verification (${{ matrix.runner_label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    needs:
      - tag-policy
      - preflight
    env:
      RELEASE_TAG: ${{ needs.tag-policy.outputs.release_tag }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            runner_label: macos-26
          - runner: macos-15
            runner_label: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag-policy.outputs.release_commit }}
          persist-credentials: false

      - name: Verify release asset ACL handling
        run: ./scripts/ci/job-release-asset-acl.sh

      - name: Download preflight release install artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: workcell-release-install-candidate
          path: dist/install

      - name: Verify release bundle installer
        env:
          HOME: ${{ runner.temp }}/workcell-home-bundle
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}"
          bundle_path="$(find dist/install -maxdepth 1 -type f -name 'workcell-*.tar.gz' -print -quit)"
          if [[ -z "${bundle_path}" ]]; then
            echo "Missing preflight release bundle artifact" >&2
            exit 1
          fi
          extract_root="${RUNNER_TEMP}/bundle-install"
          rm -rf "${extract_root}"
          mkdir -p "${extract_root}"
          tar -xzf "${bundle_path}" -C "${extract_root}"
          bundle_dir="$(find "${extract_root}" -mindepth 1 -maxdepth 1 -type d -name 'workcell-*' -print -quit)"
          if [[ -z "${bundle_dir}" ]]; then
            echo "Unable to locate extracted bundle root" >&2
            exit 1
          fi
          test ! -e "${HOME}/.local/bin/workcell"
          test ! -L "${HOME}/.local/bin/workcell"
          test ! -e "${HOME}/.local/share/man/man1/workcell.1"
          test ! -L "${HOME}/.local/share/man/man1/workcell.1"
          "${bundle_dir}/scripts/install.sh"
          "${HOME}/.local/bin/workcell" --help >/dev/null
          test -e "${HOME}/.local/bin/workcell"
          test -L "${HOME}/.local/bin/workcell"
          test -e "${HOME}/.local/share/man/man1/workcell.1"
          test -L "${HOME}/.local/share/man/man1/workcell.1"
          HOME="${HOME}" "${bundle_dir}/scripts/uninstall.sh"
          test ! -e "${HOME}/.local/bin/workcell"
          test ! -L "${HOME}/.local/bin/workcell"
          test ! -e "${HOME}/.local/share/man/man1/workcell.1"
          test ! -L "${HOME}/.local/share/man/man1/workcell.1"

      - name: Verify Homebrew formula install
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          bundle_path="$(find dist/install -maxdepth 1 -type f -name 'workcell-*.tar.gz' -print -quit)"
          if [[ -z "${bundle_path}" ]]; then
            echo "Missing preflight release bundle artifact" >&2
            exit 1
          fi
          bundle_path="$(cd "$(dirname "${bundle_path}")" && pwd -P)/$(basename "${bundle_path}")"
          tap_name="workcell/local-release"
          formula_path="${RUNNER_TEMP}/workcell-local.rb"
          brew tap-new "${tap_name}" --no-git
          tap_dir="$(brew --repo "${tap_name}")"
          mkdir -p "${tap_dir}/Formula"
          cp dist/install/workcell.rb "${tap_dir}/Formula/workcell.rb"
          formula_path="${tap_dir}/Formula/workcell.rb"
          expected_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/$(basename "${bundle_path}")"
          grep -F "url \"${expected_url}\"" "${formula_path}" >/dev/null
          BUNDLE_FILE_URL="file://${bundle_path}" perl -0pi -e 's{^  url ".*"$}{"  url \"" . $ENV{BUNDLE_FILE_URL} . "\""}me' "${formula_path}"
          brew install "${tap_name}/workcell"
          brew test "${tap_name}/workcell"
          brew uninstall --force "${tap_name}/workcell"
          if brew list --versions workcell >/dev/null 2>&1; then
            echo "Expected brew uninstall to remove the workcell formula" >&2
            exit 1
          fi
          brew cleanup workcell >/dev/null 2>&1 || true
          brew untap "${tap_name}" >/dev/null 2>&1 || true

  build-arm64-image:
    name: Build native arm64 release image
    # Build and push the linux/arm64 runtime image by digest on a native arm64
    # runner (no QEMU).  The amd64 image is still built inside the publish
    # `release` job (native on ubuntu-latest); publish consumes this job's
    # pushed-by-digest output to assemble the multi-arch manifest.  Gated on the
    # `release` environment so no image is pushed to GHCR before the same human
    # approval that gates publication, matching the existing release gate.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    needs:
      - tag-policy
      - codeql-preflight
      - preflight
      - preflight-arm64-copilot-runtime
      - preflight-container-smoke
      - install-verification
    env:
      RELEASE_TAG: ${{ needs.tag-policy.outputs.release_tag }}
      RELEASE_COMMIT: ${{ needs.tag-policy.outputs.release_commit }}
      RELEASE_TAG_OBJECT: ${{ needs.tag-policy.outputs.tag_object }}
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ env.RELEASE_TAG }}
    permissions:
      contents: read
      packages: write # Push the arm64 image (by digest) to GitHub Container Registry.
    outputs:
      digest: ${{ steps.build_arm64.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag-policy.outputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Recheck release tag before image mutation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/check-release-tag-signature.sh --github-repo "${GITHUB_REPOSITORY}" --repo-root "${GITHUB_WORKSPACE}" --tag "${RELEASE_TAG}" --expected-commit "${RELEASE_COMMIT}" --expected-tag-object "${RELEASE_TAG_OBJECT}"

      - id: source_date
        name: Compute source date epoch
        run: echo "epoch=$(git log -1 --pretty=%ct "${RELEASE_COMMIT}")" >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          cache-binary: false
          driver-opts: image=${{ env.WORKCELL_BUILDKIT_IMAGE }}
          version: ${{ env.WORKCELL_BUILDX_VERSION }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - id: build_arm64
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.source_date.outputs.epoch }}
        with:
          build-args: |
            BUILDKIT_MULTI_PLATFORM=1
            SOURCE_DATE_EPOCH=${{ steps.source_date.outputs.epoch }}
          # Build from the checked-out tree (same context the native
          # preflight-arm64-repro reproducibility check uses), so the published
          # arm64 digest matches the preflight manifest exactly.
          context: .
          file: runtime/container/Dockerfile
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true,rewrite-timestamp=true
          platforms: linux/arm64
          provenance: mode=max
          sbom: true
          tags: ${{ env.IMAGE_NAME }}

  release:
    name: Publish release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - tag-policy
      - codeql-preflight
      - preflight
      - preflight-arm64-copilot-runtime
      - preflight-container-smoke
      - install-verification
      - build-arm64-image
    env:
      RELEASE_TAG: ${{ needs.tag-policy.outputs.release_tag }}
      RELEASE_COMMIT: ${{ needs.tag-policy.outputs.release_commit }}
      RELEASE_TAG_OBJECT: ${{ needs.tag-policy.outputs.tag_object }}
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ env.RELEASE_TAG }}
    permissions:
      actions: read # Read preflight artifacts from the Actions API.
      artifact-metadata: write # Publish artifact metadata alongside release assets.
      attestations: write # Generate GitHub attestations for released artifacts.
      contents: read
      id-token: write # Mint OIDC tokens for signing and attestation workflows.
      packages: write # Push the container image to GitHub Container Registry.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag-policy.outputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Recheck release tag before signing and image mutation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/check-release-tag-signature.sh --github-repo "${GITHUB_REPOSITORY}" --repo-root "${GITHUB_WORKSPACE}" --tag "${RELEASE_TAG}" --expected-commit "${RELEASE_COMMIT}" --expected-tag-object "${RELEASE_TAG_OBJECT}"

      - name: Download preflight binding manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: workcell-release-preflight
          path: dist/preflight

      - id: source_date
        name: Compute source date epoch
        run: echo "epoch=$(git log -1 --pretty=%ct "${RELEASE_COMMIT}")" >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          cache-binary: false
          driver-opts: image=${{ env.WORKCELL_BUILDKIT_IMAGE }}
          version: ${{ env.WORKCELL_BUILDX_VERSION }}

      - name: Confirm attestation environment policy
        env:
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          if [[ "${REPOSITORY_VISIBILITY}" != "public" ]]; then
            echo "::error::Release requires GitHub attestations but they are not supported for this repository." >&2
            echo "::error::Publish the repository, or review a fork-specific workflow and hosted-control policy change." >&2
            exit 1
          fi

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.WORKCELL_COSIGN_VERSION }}

      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: ${{ env.WORKCELL_SYFT_VERSION }}

      - name: Expose signing and SBOM tools in trusted system path
        run: |
          sudo install -m 0755 "$(command -v cosign)" /usr/local/bin/cosign
          sudo install -m 0755 "$(command -v syft)" /usr/local/bin/syft

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          # Use repository_owner instead of github.actor: any maintainer
          # can tag a release; the ghcr push always targets the
          # ghcr.io/<owner> namespace, so the login user should be
          # owner-scoped rather than actor-scoped.
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Build validation tool image
        run: |
          docker build \
            -f tools/validator/Dockerfile \
            -t "workcell-validator:${RELEASE_COMMIT}" \
            .

      - name: Prepare release bundle
        env:
          WORKCELL_BUILDKIT_IMAGE: ${{ env.WORKCELL_BUILDKIT_IMAGE }}
          WORKCELL_BUILDX_VERSION: ${{ env.WORKCELL_BUILDX_VERSION }}
          SOURCE_DATE_EPOCH: ${{ steps.source_date.outputs.epoch }}
          WORKCELL_BUILD_INPUT_REF: ${{ needs.tag-policy.outputs.release_commit }}
          WORKCELL_COSIGN_VERSION: ${{ env.WORKCELL_COSIGN_VERSION }}
          WORKCELL_QEMU_IMAGE: ${{ env.WORKCELL_QEMU_IMAGE }}
          WORKCELL_SYFT_VERSION: ${{ env.WORKCELL_SYFT_VERSION }}
        run: |
          set -euo pipefail
          mkdir -p dist
          validator_uid="$(id -u)"
          validator_gid="$(id -g)"
          validator_home="/tmp/workcell-home-${validator_uid}"
          validator_cache="${validator_home}/.cache"
          validator_tmp="${validator_home}/.tmp"
          bundle="workcell-${RELEASE_TAG}.tar.gz"
          echo "BUNDLE_NAME=${bundle}" >> "${GITHUB_ENV}"
          docker run --rm \
            --user "${validator_uid}:${validator_gid}" \
            --entrypoint /bin/bash \
            -v "${PWD}:/workspace" \
            -v "${PWD}/dist:/dist" \
            -w /workspace \
            -e HOME="${validator_home}" \
            -e XDG_CACHE_HOME="${validator_cache}" \
            -e TMPDIR="${validator_tmp}" \
            -e SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH}" \
            -e ARCHIVE_REF="${RELEASE_COMMIT}" \
            -e BUNDLE_NAME="${bundle}" \
            -e BUNDLE_PREFIX="workcell-${RELEASE_TAG}/" \
            "workcell-validator:${RELEASE_COMMIT}" \
            -lc '
              set -euo pipefail
              mkdir -p "${HOME}" "${XDG_CACHE_HOME}" "${TMPDIR}"
              bundle_tar="/dist/${BUNDLE_NAME%.tar.gz}.tar"
              git -c safe.directory=/workspace archive \
                --format=tar \
                --mtime="@${SOURCE_DATE_EPOCH}" \
                --prefix="${BUNDLE_PREFIX}" \
                -o "${bundle_tar}" \
                "${ARCHIVE_REF}"
              gzip -n -9 < "${bundle_tar}" > "/dist/${BUNDLE_NAME}"
              rm -f "${bundle_tar}"
            '
          mkdir -p dist/source-tree
          tar -xzf "dist/${bundle}" -C dist/source-tree
          ln -sfn "source-tree/workcell-${RELEASE_TAG}" dist/release-source
          echo "RELEASE_SOURCE_ROOT=dist/release-source" >> "${GITHUB_ENV}"
          ./scripts/generate-build-input-manifest.sh dist/workcell-build-inputs.json
          ./scripts/generate-builder-environment-manifest.sh dist/workcell-builder-environment.json

      - name: Re-verify pinned upstreams from archived source tree
        env:
          GITHUB_TOKEN: ${{ github.token }}
        working-directory: dist/release-source
        run: |
          token_file="$(umask 077 && mktemp "${RUNNER_TEMP}/workcell-github-token.XXXXXX")"; trap 'rm -f "${token_file}"' EXIT
          (umask 077 && printf '%s' "${GITHUB_TOKEN}" >"${token_file}")
          unset GITHUB_TOKEN GH_TOKEN
          export WORKCELL_GITHUB_API_TOKEN_FILE="${token_file}"
          ./scripts/verify-upstream-codex-release.sh
          ./scripts/verify-upstream-claude-release.sh
          ./scripts/verify-upstream-copilot-release.sh
          ./scripts/verify-upstream-gemini-release.sh
          ./scripts/update-upstream-pins.sh --check

      - name: Verify release bundle matches preflight
        run: |
          set -euo pipefail
          manifest="dist/preflight/workcell-release-bundle-preflight.json"
          bundle_name="$(jq -r '.bundle_name' "${manifest}")"
          expected_digest="$(jq -r '.bundle_sha256' "${manifest}")"
          actual_digest="$(sha256sum "dist/${bundle_name}" | awk '{print $1}')"
          if [[ "${actual_digest}" != "${expected_digest}" ]]; then
            echo "Release bundle digest mismatch: ${actual_digest} != ${expected_digest}" >&2
            exit 1
          fi

      - name: Regenerate build input manifest from archived source tree
        env:
          WORKCELL_BUILD_INPUT_ROOT: ${{ github.workspace }}/dist/release-source
          WORKCELL_BUILD_INPUT_REF: ${{ needs.tag-policy.outputs.release_commit }}
          SOURCE_DATE_EPOCH: ${{ steps.source_date.outputs.epoch }}
        run: ./scripts/generate-build-input-manifest.sh dist/workcell-build-inputs-archived.json

      - name: Regenerate control-plane manifest from archived source tree
        env:
          WORKCELL_CONTROL_PLANE_ROOT: ${{ github.workspace }}/dist/release-source
        run: ./scripts/generate-control-plane-manifest.sh dist/workcell-control-plane.json

      - name: Generate Homebrew formula asset
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          bundle_sha="$(sha256sum "dist/${BUNDLE_NAME}" | awk '{print $1}')"
          ./scripts/generate-homebrew-formula.sh \
            "${RELEASE_TAG}" \
            "${bundle_sha}" \
            dist/workcell.rb \
            --repository "${GITHUB_REPOSITORY}"

      - name: Verify build input manifest matches preflight
        run: |
          cmp -s \
            dist/workcell-build-inputs-archived.json \
            dist/preflight/workcell-build-inputs-preflight.json

      - name: Verify control-plane manifest matches preflight
        run: |
          cmp -s \
            dist/workcell-control-plane.json \
            dist/preflight/workcell-control-plane-preflight.json

      - id: build_amd64
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.source_date.outputs.epoch }}
        with:
          build-args: |
            BUILDKIT_MULTI_PLATFORM=1
            SOURCE_DATE_EPOCH=${{ steps.source_date.outputs.epoch }}
          context: dist/release-source
          file: dist/release-source/runtime/container/Dockerfile
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true,rewrite-timestamp=true
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          tags: ${{ env.IMAGE_NAME }}

      - name: Verify published platform digests match preflight
        env:
          AMD64_DIGEST: ${{ steps.build_amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.build-arm64-image.outputs.digest }}
        run: |
          set -euo pipefail

          inspect_raw() {
            docker buildx imagetools inspect --raw "$1"
          }

          resolve_published_platform() {
            local index_digest="$1"
            local platform="$2"
            local ref="${IMAGE_NAME}@${index_digest}"
            local os_name="${platform%%/*}"
            local arch="${platform#*/}"
            local document=""
            local media_type=""
            local image_manifest_digest=""
            local image_manifest=""
            local config_digest=""
            local -a candidate_digests=()

            document="$(inspect_raw "${ref}")"
            media_type="$(jq -r '.mediaType // empty' <<<"${document}")"

            case "${media_type}" in
              application/vnd.docker.distribution.manifest.v2+json|application/vnd.oci.image.manifest.v1+json)
                image_manifest_digest="${index_digest}"
                image_manifest="${document}"
                ;;
              application/vnd.docker.distribution.manifest.list.v2+json|application/vnd.oci.image.index.v1+json)
                mapfile -t candidate_digests < <(
                  jq -r --arg os "${os_name}" --arg arch "${arch}" '
                    .manifests // []
                    | map(select((.annotations["vnd.docker.reference.type"] // "") != "attestation-manifest"))
                    | map(select(.platform.os == $os and .platform.architecture == $arch))
                    | .[].digest
                  ' <<<"${document}"
                )
                if [[ "${#candidate_digests[@]}" -ne 1 ]]; then
                  echo "Expected exactly one published image manifest for ${platform} in ${ref}, found ${#candidate_digests[@]}" >&2
                  exit 1
                fi
                image_manifest_digest="${candidate_digests[0]}"
                if [[ "${image_manifest_digest}" != sha256:* ]]; then
                  echo "Malformed published image manifest digest for ${platform} in ${ref}: ${image_manifest_digest}" >&2
                  exit 1
                fi
                image_manifest="$(inspect_raw "${IMAGE_NAME}@${image_manifest_digest}")"
                ;;
              *)
                echo "Unsupported published descriptor media type for ${ref}: ${media_type}" >&2
                exit 1
                ;;
            esac

            config_digest="$(jq -r '.config.digest // empty' <<<"${image_manifest}")"
            if [[ "${config_digest}" != sha256:* ]]; then
              echo "Malformed published config digest for ${platform} in ${ref}: ${config_digest}" >&2
              exit 1
            fi

            printf '%s %s\n' "${image_manifest_digest}" "${config_digest}"
          }

          expected_manifest_amd64="$(jq -r '.platforms["linux/amd64"].image_manifest_digest' dist/preflight/workcell-runtime-preflight.json)"
          expected_config_amd64="$(jq -r '.platforms["linux/amd64"].config_digest' dist/preflight/workcell-runtime-preflight.json)"
          expected_manifest_arm64="$(jq -r '.platforms["linux/arm64"].image_manifest_digest' dist/preflight/workcell-runtime-preflight.json)"
          expected_config_arm64="$(jq -r '.platforms["linux/arm64"].config_digest' dist/preflight/workcell-runtime-preflight.json)"

          read -r actual_manifest_amd64 actual_config_amd64 < <(resolve_published_platform "${AMD64_DIGEST}" "linux/amd64")
          read -r actual_manifest_arm64 actual_config_arm64 < <(resolve_published_platform "${ARM64_DIGEST}" "linux/arm64")

          if [[ "${actual_manifest_amd64}" != "${expected_manifest_amd64}" ]] || \
             [[ "${actual_config_amd64}" != "${expected_config_amd64}" ]] || \
             [[ "${actual_manifest_arm64}" != "${expected_manifest_arm64}" ]] || \
             [[ "${actual_config_arm64}" != "${expected_config_arm64}" ]]; then
            echo "Published platform image/config digests differ from preflight" >&2
            echo "amd64: ${actual_manifest_amd64} ${actual_config_amd64} expected ${expected_manifest_amd64} ${expected_config_amd64}" >&2
            echo "arm64: ${actual_manifest_arm64} ${actual_config_arm64} expected ${expected_manifest_arm64} ${expected_config_arm64}" >&2
            exit 1
          fi

      - name: Recheck release tag before named image publication
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/check-release-tag-signature.sh --github-repo "${GITHUB_REPOSITORY}" --repo-root "${GITHUB_WORKSPACE}" --tag "${RELEASE_TAG}" --expected-commit "${RELEASE_COMMIT}" --expected-tag-object "${RELEASE_TAG_OBJECT}"

      - id: publish_manifest
        name: Publish deterministic multi-arch manifest
        env:
          AMD64_DIGEST: ${{ steps.build_amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.build-arm64-image.outputs.digest }}
        run: |
          refs=(
            "${IMAGE_NAME}@${AMD64_DIGEST}"
            "${IMAGE_NAME}@${ARM64_DIGEST}"
          )
          docker buildx imagetools create \
            -t "${IMAGE_NAME}:${RELEASE_TAG}" \
            -t "${IMAGE_NAME}:sha-${RELEASE_COMMIT}" \
            "${refs[@]}"
          manifest_json="$(docker buildx imagetools inspect "${IMAGE_NAME}:${RELEASE_TAG}" --format '{{json .Manifest}}')"
          image_manifests_json="$(jq -c '[.manifests[]? | select((.annotations["vnd.docker.reference.type"] // "") != "attestation-manifest")]' <<<"${manifest_json}")"
          platform_arches="$(jq -r '[.[].platform.architecture] | @json' <<<"${image_manifests_json}")"
          if [[ "${platform_arches}" != '["amd64","arm64"]' ]]; then
            echo "Deterministic multi-arch image manifest must contain exactly amd64 then arm64, found ${platform_arches}" >&2
            exit 1
          fi

          digest="$(jq -r '.digest // empty' <<<"${manifest_json}")"
          if [[ "${digest}" != sha256:* ]]; then
            echo "Unable to determine published manifest digest from imagetools inspect: ${digest}" >&2
            exit 1
          fi

          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          printf '%s@%s\n' "${IMAGE_NAME}" "${digest}" > dist/workcell-image.digest

      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          artifact-name: workcell-source.spdx.json
          format: spdx-json
          output-file: dist/workcell-source.spdx.json
          path: dist/release-source
          syft-version: ${{ env.WORKCELL_SYFT_VERSION }}
          upload-artifact: false
          upload-release-assets: false

      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          artifact-name: workcell-image.spdx.json
          format: spdx-json
          image: ${{ env.IMAGE_NAME }}@${{ steps.publish_manifest.outputs.digest }}
          output-file: dist/workcell-image.spdx.json
          syft-version: ${{ env.WORKCELL_SYFT_VERSION }}
          upload-artifact: false
          upload-release-assets: false

      - name: Generate release checksums
        run: |
          ./scripts/generate-release-checksums.sh dist/SHA256SUMS \
            "dist/${BUNDLE_NAME}" \
            dist/workcell.rb \
            dist/workcell-image.digest \
            dist/workcell-build-inputs.json \
            dist/workcell-control-plane.json \
            dist/workcell-builder-environment.json \
            dist/workcell-source.spdx.json \
            dist/workcell-image.spdx.json

      - name: Sign release image
        env:
          COSIGN_YES: "true"
          IMAGE_DIGEST: ${{ steps.publish_manifest.outputs.digest }}
        run: |
          cosign sign "${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Sign published source bundle
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign-blob \
            --bundle "dist/${BUNDLE_NAME}.sigstore.json" \
            "dist/${BUNDLE_NAME}"

      - name: Sign Homebrew formula asset
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign-blob \
            --bundle dist/workcell.rb.sigstore.json \
            dist/workcell.rb

      - name: Sign published image digest file
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign-blob \
            --bundle dist/workcell-image.digest.sigstore.json \
            dist/workcell-image.digest

      - name: Sign release checksums
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign-blob \
            --bundle dist/SHA256SUMS.sigstore.json \
            dist/SHA256SUMS

      - name: Sign build input manifest
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign-blob \
            --bundle dist/workcell-build-inputs.sigstore.json \
            dist/workcell-build-inputs.json

      - name: Sign control-plane manifest
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign-blob \
            --bundle dist/workcell-control-plane.sigstore.json \
            dist/workcell-control-plane.json

      - name: Sign builder environment manifest
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign-blob \
            --bundle dist/workcell-builder-environment.sigstore.json \
            dist/workcell-builder-environment.json

      - name: Sign published source SBOM
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign-blob \
            --bundle dist/workcell-source.spdx.sigstore.json \
            dist/workcell-source.spdx.json

      - name: Sign published image SBOM
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign-blob \
            --bundle dist/workcell-image.spdx.sigstore.json \
            dist/workcell-image.spdx.json

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish_manifest.outputs.digest }}
          push-to-registry: true

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          sbom-path: dist/workcell-image.spdx.json
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish_manifest.outputs.digest }}
          push-to-registry: true

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ env.BUNDLE_NAME }}

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          sbom-path: dist/workcell-source.spdx.json
          subject-path: dist/${{ env.BUNDLE_NAME }}

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/workcell.rb

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/workcell-image.digest

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/workcell-build-inputs.json

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/workcell-control-plane.json

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/workcell-builder-environment.json

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/SHA256SUMS

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workcell-release-artifacts
          path: |
            dist/${{ env.BUNDLE_NAME }}
            dist/${{ env.BUNDLE_NAME }}.sigstore.json
            dist/workcell.rb
            dist/workcell.rb.sigstore.json
            dist/workcell-image.digest
            dist/workcell-image.digest.sigstore.json
            dist/workcell-build-inputs.json
            dist/workcell-build-inputs.sigstore.json
            dist/workcell-control-plane.json
            dist/workcell-control-plane.sigstore.json
            dist/workcell-builder-environment.json
            dist/workcell-builder-environment.sigstore.json
            dist/SHA256SUMS
            dist/SHA256SUMS.sigstore.json
            dist/workcell-source.spdx.json
            dist/workcell-source.spdx.sigstore.json
            dist/workcell-image.spdx.json
            dist/workcell-image.spdx.sigstore.json
          retention-days: 7

  verify-release-outputs:
    name: Verify release signatures and attestations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - tag-policy
      - release
    env:
      RELEASE_TAG: ${{ needs.tag-policy.outputs.release_tag }}
      RELEASE_COMMIT: ${{ needs.tag-policy.outputs.release_commit }}
    permissions:
      actions: read # Download the sealed artifact from the release job.
      attestations: read # Read GitHub artifact attestations.
      contents: read
      packages: read # Read the signed image from GHCR.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag-policy.outputs.release_commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download sealed release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: workcell-release-artifacts
          path: dist

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.WORKCELL_COSIGN_VERSION }}

      - name: Expose Cosign in trusted system path
        run: sudo install -m 0755 "$(command -v cosign)" /usr/local/bin/cosign

      - name: Verify release outputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          docker_config="$(mktemp -d "${RUNNER_TEMP}/workcell-docker-config.XXXXXX")"
          chmod 0700 "${docker_config}"
          trap 'rm -rf -- "${docker_config}"' EXIT
          export DOCKER_CONFIG="${docker_config}"
          printf '%s' "${GITHUB_TOKEN}" | docker login ghcr.io \
            --username "${GITHUB_REPOSITORY_OWNER}" \
            --password-stdin
          verify_args=(
            --assets-dir dist
            --repo "${GITHUB_REPOSITORY}"
            --tag "${RELEASE_TAG}"
            --image-repository "${IMAGE_NAME}"
            --source-digest "${RELEASE_COMMIT}"
            --workflow-digest "${GITHUB_WORKFLOW_SHA}"
            --attestations
          )
          ./scripts/verify-release-outputs.sh "${verify_args[@]}"

  publish-github-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - tag-policy
      - release
      - verify-release-outputs
    env:
      RELEASE_TAG: ${{ needs.tag-policy.outputs.release_tag }}
      RELEASE_COMMIT: ${{ needs.tag-policy.outputs.release_commit }}
      RELEASE_TAG_OBJECT: ${{ needs.tag-policy.outputs.tag_object }}
    environment:
      name: hosted-controls-audit
    permissions:
      actions: read # Download the sealed artifact from the release job.
      attestations: read # Verify GitHub attestations before publication.
      contents: write # Create the GitHub release and upload release assets.
      packages: read # Verify the signed image in GHCR before publication.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag-policy.outputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download sealed release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: workcell-release-artifacts
          path: dist

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.WORKCELL_COSIGN_VERSION }}

      - name: Expose Cosign in trusted system path
        run: sudo install -m 0755 "$(command -v cosign)" /usr/local/bin/cosign

      - name: Re-verify sealed release outputs before publication
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          docker_config="$(mktemp -d "${RUNNER_TEMP}/workcell-docker-config.XXXXXX")"
          chmod 0700 "${docker_config}"
          trap 'rm -rf -- "${docker_config}"' EXIT
          export DOCKER_CONFIG="${docker_config}"
          printf '%s' "${GITHUB_TOKEN}" | docker login ghcr.io \
            --username "${GITHUB_REPOSITORY_OWNER}" \
            --password-stdin
          verify_args=(
            --assets-dir dist
            --repo "${GITHUB_REPOSITORY}"
            --tag "${RELEASE_TAG}"
            --image-repository "${IMAGE_NAME}"
            --source-digest "${RELEASE_COMMIT}"
            --workflow-digest "${GITHUB_WORKFLOW_SHA}"
            --attestations
          )
          ./scripts/verify-release-outputs.sh "${verify_args[@]}"

      - name: Verify release tag signature
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/check-release-tag-signature.sh --github-repo "${GITHUB_REPOSITORY}" --repo-root "${GITHUB_WORKSPACE}" --tag "${RELEASE_TAG}" --expected-commit "${RELEASE_COMMIT}" --expected-tag-object "${RELEASE_TAG_OBJECT}"

      - name: Recheck hosted controls and publish GitHub release assets
        env:
          BUNDLE_NAME: workcell-${{ env.RELEASE_TAG }}.tar.gz
          GITHUB_TOKEN: ${{ github.token }}
          WORKCELL_HOSTED_CONTROLS_REQUIRED: "1"
          WORKCELL_HOSTED_CONTROLS_TOKEN: ${{ secrets.WORKCELL_HOSTED_CONTROLS_TOKEN }}
        run: |
          # Refresh the admin-metadata proof after release approval and artifact
          # construction, then remove that credential before the publisher uses
          # the default Actions token for release mutations.
          ./scripts/run-hosted-controls-audit.sh "${GITHUB_REPOSITORY}"
          unset WORKCELL_HOSTED_CONTROLS_TOKEN
          ./scripts/publish-github-release.sh "${RELEASE_TAG}" \
            --expected-tag-object "${RELEASE_TAG_OBJECT}" \
            --immutable-releases-preverified-by-hosted-controls \
            "dist/${BUNDLE_NAME}" \
            "dist/${BUNDLE_NAME}.sigstore.json" \
            dist/workcell.rb \
            dist/workcell.rb.sigstore.json \
            dist/workcell-image.digest \
            dist/workcell-image.digest.sigstore.json \
            dist/workcell-build-inputs.json \
            dist/workcell-build-inputs.sigstore.json \
            dist/workcell-control-plane.json \
            dist/workcell-control-plane.sigstore.json \
            dist/workcell-builder-environment.json \
            dist/workcell-builder-environment.sigstore.json \
            dist/SHA256SUMS \
            dist/SHA256SUMS.sigstore.json \
            dist/workcell-source.spdx.json \
            dist/workcell-source.spdx.sigstore.json \
            dist/workcell-image.spdx.json \
            dist/workcell-image.spdx.sigstore.json
