name: Pin Hygiene

# This workflow is the WEEKLY-CRON pin-hygiene lane.  scripts/ci/job-validate.sh
# runs scripts/check-pinned-inputs.sh,
# scripts/verify-upstream-{codex,claude,copilot,gemini}-release.sh, and (on the
# release-preflight profile only) scripts/update-upstream-pins.sh --check.
# This cron lane runs the same checks and scripts/update-upstream-pins.sh
# --hygiene, which fails only on drift that the daily upstream-refresh
# workflow should already have handled: drift past its cool-off plus a grace
# with no fresh refresh PR, or a release held that long on an unclassified
# CLI surface. Drift that is younger or carried by a refresh PR shows in the
# job summary. The full update-upstream-pins --check is intentionally not in
# PR parity because upstream-release availability drift would block routine
# PR work; Debian bootstrap pins now update atomically.

on:
  schedule:
    - cron: "0 14 * * 2"
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned-inputs:
    name: Check pinned inputs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read # Read the open upstream refresh PRs that carry pending drift.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: pins
        name: Load tool pins
        run: ./scripts/ci/load-tool-pins.sh

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ steps.pins.outputs.cosign }}

      - name: Expose cosign in trusted system path
        run: |
          sudo install -m 0755 "$(command -v cosign)" /usr/local/bin/cosign

      - name: Check pinned upstream hygiene
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          token_file="$(umask 077 && mktemp "${RUNNER_TEMP}/workcell-github-token.XXXXXX")"; trap 'rm -f "${token_file}"' EXIT
          (umask 077 && printf '%s' "${GITHUB_TOKEN}" >"${token_file}")
          unset GITHUB_TOKEN GH_TOKEN
          WORKCELL_GITHUB_API_TOKEN_FILE="${token_file}" ./scripts/ci/job-pin-hygiene.sh
