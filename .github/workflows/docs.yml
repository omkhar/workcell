name: Docs

on:
  push:
    branches:
      - main
    paths:
      - ".codespellrc"
      - "**/*.md"
      - "CHANGELOG.md"
      - "CODE_OF_CONDUCT.md"
      - "CONTRIBUTING.md"
      - "GOVERNANCE.md"
      - "MAINTAINERS.md"
      - "README.md"
      - "ROADMAP.md"
      - "AGENTS.md"
      - "SECURITY.md"
      - "SUPPORT.md"
      - "adapters/**"
      - "docs/**"
      - "man/**"
      - "policy/**"
      - "runtime/**"
      - "cmd/**"
      - "internal/**"
      - "scripts/check-doc-language.sh"
      - "scripts/check-doc-links.sh"
      - "scripts/check-doc-support-matrix-fields.sh"
      - "scripts/check-public-contract.sh"
      - "scripts/workcell"
      - "scripts/ci/job-docs.sh"
      - "verify/**"
      - "workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - ".codespellrc"
      - "**/*.md"
      - "CHANGELOG.md"
      - "CODE_OF_CONDUCT.md"
      - "CONTRIBUTING.md"
      - "GOVERNANCE.md"
      - "MAINTAINERS.md"
      - "README.md"
      - "ROADMAP.md"
      - "AGENTS.md"
      - "SECURITY.md"
      - "SUPPORT.md"
      - "adapters/**"
      - "docs/**"
      - "man/**"
      - "policy/**"
      - "runtime/**"
      - "cmd/**"
      - "internal/**"
      - "scripts/check-doc-language.sh"
      - "scripts/check-doc-links.sh"
      - "scripts/check-doc-support-matrix-fields.sh"
      - "scripts/check-public-contract.sh"
      - "scripts/workcell"
      - "scripts/ci/job-docs.sh"
      - "verify/**"
      - "workflows/**"
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  WORKCELL_BUILDKIT_IMAGE: moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
  # Pinned identically to ci.yml and release.yml so all three workflows
  # share validator-image layer caches deterministically.
  WORKCELL_BUILDX_VERSION: v0.37.2

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spelling-and-manpage:
    name: Spelling and manpage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          cache-binary: true
          driver-opts: image=${{ env.WORKCELL_BUILDKIT_IMAGE }}
          version: ${{ env.WORKCELL_BUILDX_VERSION }}

      - name: Check docs spelling and manpage
        env:
          WORKCELL_VALIDATOR_IMAGE: workcell-validator:${{ github.sha }}
          WORKCELL_VALIDATOR_BUILDX_CACHE_MODE: gha
          # Shares the validator-main / validator-pr-* cache scopes with
          # ci.yml so this build reuses the layers ci.yml already built for
          # the same commit. Concurrent writes to one scope are safe: cache
          # entries are content-addressed and reads never block.
          WORKCELL_VALIDATOR_BUILDX_CACHE_SCOPE: ${{ github.event_name == 'pull_request' && format('validator-pr-{0}', github.event.pull_request.number) || 'validator-main' }}
          WORKCELL_VALIDATOR_BUILDX_CACHE_WRITE_MODE: ${{ github.event_name == 'push' && 'max' || 'min' }}
        run: ./scripts/ci/job-docs.sh
