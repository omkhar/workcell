name: Docs

on:
  push:
    branches:
      - main
    paths:
      - ".codespellrc"
      - "**/*.md"
      - "CHANGELOG.md"
      - "CODE_OF_CONDUCT.md"
      - "CONTRIBUTING.md"
      - "GOVERNANCE.md"
      - "MAINTAINERS.md"
      - "README.md"
      - "ROADMAP.md"
      - "AGENTS.md"
      - "SECURITY.md"
      - "SUPPORT.md"
      - "adapters/**"
      - "docs/**"
      - "man/**"
      - "policy/**"
      - "runtime/**"
      - "cmd/**"
      - "internal/**"
      - "scripts/check-doc-language.sh"
      - "scripts/check-doc-links.sh"
      - "scripts/check-doc-support-matrix-fields.sh"
      - "scripts/check-public-contract.sh"
      - "scripts/workcell"
      - "scripts/ci/job-docs.sh"
      - "verify/**"
      - "workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - ".codespellrc"
      - "**/*.md"
      - "CHANGELOG.md"
      - "CODE_OF_CONDUCT.md"
      - "CONTRIBUTING.md"
      - "GOVERNANCE.md"
      - "MAINTAINERS.md"
      - "README.md"
      - "ROADMAP.md"
      - "AGENTS.md"
      - "SECURITY.md"
      - "SUPPORT.md"
      - "adapters/**"
      - "docs/**"
      - "man/**"
      - "policy/**"
      - "runtime/**"
      - "cmd/**"
      - "internal/**"
      - "scripts/check-doc-language.sh"
      - "scripts/check-doc-links.sh"
      - "scripts/check-doc-support-matrix-fields.sh"
      - "scripts/check-public-contract.sh"
      - "scripts/workcell"
      - "scripts/ci/job-docs.sh"
      - "verify/**"
      - "workflows/**"
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spelling-and-manpage:
    name: Spelling and manpage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: pins
        name: Load tool pins
        run: ./scripts/ci/load-tool-pins.sh

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: true
          driver-opts: image=${{ steps.pins.outputs.buildkit }}
          version: ${{ steps.pins.outputs.buildx }}

      - name: Check docs spelling and manpage
        env:
          WORKCELL_BUILDKIT_IMAGE: ${{ steps.pins.outputs.buildkit }}
          WORKCELL_VALIDATOR_IMAGE: workcell-validator:${{ github.sha }}
          WORKCELL_VALIDATOR_BUILDX_CACHE_MODE: gha
          # Shares the validator-main / validator-pr-* cache scopes with
          # ci.yml so this build reuses the layers ci.yml already built for
          # the same commit. Concurrent writes to one scope are safe: cache
          # entries are content-addressed and reads never block.
          WORKCELL_VALIDATOR_BUILDX_CACHE_SCOPE: ${{ github.event_name == 'pull_request' && format('validator-pr-{0}', github.event.pull_request.number) || 'validator-main' }}
          WORKCELL_VALIDATOR_BUILDX_CACHE_WRITE_MODE: ${{ github.event_name == 'push' && 'max' || 'min' }}
        run: ./scripts/ci/job-docs.sh
